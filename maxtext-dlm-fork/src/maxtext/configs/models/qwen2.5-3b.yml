# Qwen 2.5 3B Configuration (Fast-dDrive text tower)
# Dims taken from Fast-dDrive Qwen25TextConfig.fast_ddrive() in
# jax_ddrive/ddrive_jax/models/qwen2_5_text.py
# (Efficient-Large-Model/Fast-dDrive config.json text_config)

base_emb_dim: 2048
base_num_query_heads: 16
base_num_kv_heads: 2
base_mlp_dim: 11008
base_num_decoder_layers: 36
head_dim: 128
mlp_activations: ["silu", "linear"]
vocab_size: 151936
decoder_block: "qwen2"
normalization_layer_epsilon: 1.0e-6
rope_max_timescale: 1000000.0
use_qk_norm: False
# Bias for q, k, v proj.
attention_bias: True
logits_via_embedding: True
normalize_embedding_logits: False
tokenizer_type: "huggingface"
